{% extends "base.html" %}
{% block content %}
<p>Abra o app autenticador no celular e digite o código de 6 dígitos do <b>Jervis3000</b>.</p>
<form method="post" action="/login/codigo" class="form">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="code">Código</label>
  <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus>
  <button type="submit" class="btn primary">Confirmar</button>
</form>
<p class="hint">Trocou de celular? Peça a um administrador para redefinir o seu app autenticador.</p>
{% endblock %}
