<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revisões · Jervis3000</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><b>Jervis3000</b><span>Relatórios de TI</span></div>
    <nav class="nav" aria-label="Módulos">
      <a href="/" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 11l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/></svg>
        Revisões <span class="count" id="navCount" hidden>0</span></a>
      <span class="nav-item soon-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Fechamento <span class="soon">em breve</span></span>
      <span class="nav-item soon-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5M16 5.5a3 3 0 010 5.6M18 15c1.6.7 2.6 2.4 3 5"/></svg>
        Clientes <span class="soon">em breve</span></span>
    </nav>
    <div class="side-foot">
      <span id="nextClose"></span>
      <span class="who"><b id="userName"></b><small id="userRole"></small></span>
      <button type="button" class="link" id="logout">Sair</button>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <div>
        <h1>Revisão dos relatórios</h1>
        <p id="subtitle">Carregando…</p>
      </div>
      <div class="month">
        <label for="competencia">Competência</label>
        <select id="competencia"></select>
      </div>
    </div>

    <div class="banner" id="banner" hidden></div>
    <div class="jobs" id="jobs" hidden></div>

    <div class="summary" id="summary"></div>

    <div class="tools">
      <div class="chips" id="chips" role="group" aria-label="Filtrar"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente">
      </label>
    </div>

    <div class="bulk" id="bulk" hidden></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="check"><input type="checkbox" id="checkAll" aria-label="Selecionar todos os pendentes visíveis"></th>
            <th>Cliente</th>
            <th>Plataformas</th>
            <th>Resultado</th>
            <th>Situação</th>
            <th>Gerado em</th>
            <th class="right">Ações</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="dTitle" role="dialog"></aside>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
