[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jervis3000"
version = "0.1.0"
description = "Coleta por API (Acronis, Sophos Central, Zabbix), relatórios mensais por cliente e revisão pela equipe"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.20",
    "keyring>=25",
    "pyotp>=2.9",
    "PyYAML>=6",
    "openpyxl>=3.1",
    "Jinja2>=3.1",
    "PyMySQL>=1.1",       # driver do MySQL (Python puro)
    "cryptography>=43",   # criptografia da chave MFA guardada no banco
    "celery>=5.4",        # fila de tarefas
    "amqp>=5.2",          # protocolo do RabbitMQ (broker do Celery)
    "anthropic>=1.12.1",
    "flask>=3.0",
    "cheroot>=10.0",
    "segno>=1.6",
]

# Gerenciado com uv:  py -3.12 -m uv sync   (instala também o grupo dev)
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "pyflakes>=3"]

[project.scripts]
jervis = "jervis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jervis = ["templates/*.yaml", "reports/templates/*.j2", "web/static/*", "web/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: testes que abrem um navegador real (mais lentos)"]
