<!doctype html>
<html><head><meta charset="utf-8"><title>Sophos falso</title></head>
<body><div id="app"></div><script src="../common/table.js"></script><script>
// Na primeira visita (por URL) a página nunca termina de carregar; na segunda, funciona.
const key = 'flaky' + location.search;
const visits = Number(sessionStorage.getItem(key) || 0) + 1;
sessionStorage.setItem(key, visits);
if (visits === 1) document.getElementById('app').innerHTML = '<div class="spinner" role="progressbar"></div>';
else renderTable({ headers: ['Nome', 'SO'], rows: [['PC-RETRY', 'Windows 10']] });
</script></body></html>
